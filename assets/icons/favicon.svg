<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Subtle glow background circle -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#softGlow)" />

  <!-- Minimalist Flame & Lightning Icon -->
  <path d="M256 96 C270 170 340 210 340 290 C340 350 295 390 256 416 C217 390 172 350 172 290 C172 230 220 170 232 140 C240 180 260 205 275 220 C270 170 260 120 256 96 Z" fill="url(#flameGrad)" />
  
  <!-- Minimalist Inner Core Flame -->
  <path d="M256 250 C265 285 295 305 295 340 C295 365 275 380 256 392 C237 380 217 365 217 340 C217 310 240 280 246 268 C250 285 260 295 268 300 C265 278 258 260 256 250 Z" fill="#ffffff" opacity="0.9" />

  <!-- Lightning energetic accent -->
  <path d="M295 160 L245 250 L275 250 L225 350 L285 240 L255 240 Z" fill="#06b6d4" opacity="0.4" />
</svg>
